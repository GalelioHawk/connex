<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#006B3C"/>
      <stop offset="100%" style="stop-color:#00A86B"/>
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="1200" height="320" fill="white"/>

  <!-- Mark: outer ring -->
  <circle cx="160" cy="160" r="136" fill="none" stroke="#0D1B2A" stroke-width="10"/>

  <!-- Mark: nodes -->
  <circle cx="160" cy="76"  r="20" fill="url(#g)"/>
  <circle cx="160" cy="244" r="20" fill="url(#g)"/>
  <circle cx="76"  cy="160" r="20" fill="#0D1B2A"/>
  <circle cx="244" cy="160" r="20" fill="#0D1B2A"/>

  <!-- Mark: connecting lines -->
  <line x1="160" y1="96"  x2="160" y2="144" stroke="#0D1B2A"  stroke-width="6" stroke-linecap="round"/>
  <line x1="160" y1="176" x2="160" y2="224" stroke="#0D1B2A"  stroke-width="6" stroke-linecap="round"/>
  <line x1="96"  y1="160" x2="140" y2="160" stroke="url(#g)"  stroke-width="6" stroke-linecap="round"/>
  <line x1="180" y1="160" x2="224" y2="160" stroke="url(#g)"  stroke-width="6" stroke-linecap="round"/>

  <!-- Mark: center dot -->
  <circle cx="160" cy="160" r="14" fill="url(#g)"/>

  <!-- Wordmark -->
  <text
    x="348"
    y="212"
    font-family="Inter, Arial Black, sans-serif"
    font-size="164"
    font-weight="900"
    fill="#0D1B2A"
    letter-spacing="-6"
  >Connex</text>
</svg>
