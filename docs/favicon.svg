<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#004D2A"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f0e8"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>

  <!-- Subtle inner glow on background -->
  <rect width="64" height="64" rx="14" ry="14" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>

  <!-- C arc mark: center (32,32), radius 14, opening on right side -->
  <!-- From top-right (-45deg) counterclockwise to bottom-right (+45deg) -->
  <path
    d="M 41.9 22.1 A 14 14 0 1 0 41.9 41.9"
    stroke="url(#arc)"
    stroke-width="7"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Green accent dot at bottom tip of C -->
  <circle cx="41.9" cy="41.9" r="4.8" fill="#00A86B"/>
  <!-- Inner highlight on dot -->
  <circle cx="40.4" cy="40.4" r="1.8" fill="#00D48A" opacity="0.6"/>
</svg>
