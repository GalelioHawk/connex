<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Connex Logo Export</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #E8E8E8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 32px;
      padding: 48px;
    }
    .label {
      font-family: sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 12px;
      text-align: center;
    }

    /* ── Logo lockup ── */
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    /* The C mark — mirrors the favicon exactly */
    .c-mark {
      width: 120px;
      height: 120px;
      flex-shrink: 0;
    }

    /* Wordmark */
    .wordmark {
      font-family: 'Poppins', sans-serif;
      font-weight: 900;
      font-size: 96px;
      letter-spacing: -3px;
      line-height: 1;
      background: linear-gradient(90deg, #00A86B 0%, #006B3C 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Cards */
    .card {
      padding: 56px 80px;
      border-radius: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .card.light { background: #ffffff; }
    .card.dark  { background: #0D1B2A; }
    .card.dark .wordmark {
      background: linear-gradient(90deg, #00A86B 0%, #00D48A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tip {
      font-family: sans-serif;
      font-size: 14px;
      color: #666;
      text-align: center;
      max-width: 500px;
      line-height: 1.6;
      background: white;
      padding: 20px 28px;
      border-radius: 12px;
    }
    .tip strong { color: #0D1B2A; }
    code { background: #f0f0f0; padding: 2px 7px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>

  <!-- Light version -->
  <div>
    <p class="label">Light — for white / clear backgrounds (use this one)</p>
    <div class="card light" id="logo-light">
      <div class="logo-wrap">
        <!-- Exact C mark from favicon.svg -->
        <svg class="c-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#0D1B2A"/>
              <stop offset="100%" stop-color="#004D2A"/>
            </linearGradient>
            <linearGradient id="arc" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#e0f0e8"/>
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>
          <rect width="64" height="64" rx="14" ry="14" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
          <path d="M 41.9 22.1 A 14 14 0 1 0 41.9 41.9" stroke="url(#arc)" stroke-width="7" stroke-linecap="round" fill="none"/>
          <circle cx="41.9" cy="41.9" r="4.8" fill="#00A86B"/>
          <circle cx="40.4" cy="40.4" r="1.8" fill="#00D48A" opacity="0.6"/>
        </svg>

        <span class="wordmark">Connex</span>
      </div>
    </div>
  </div>

  <!-- Dark version -->
  <div>
    <p class="label">Dark version</p>
    <div class="card dark">
      <div class="logo-wrap">
        <svg class="c-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
          <defs>
            <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#1C2E3F"/>
              <stop offset="100%" stop-color="#0D3B26"/>
            </linearGradient>
            <linearGradient id="arc2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#e0f0e8"/>
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="14" ry="14" fill="url(#bg2)"/>
          <path d="M 41.9 22.1 A 14 14 0 1 0 41.9 41.9" stroke="url(#arc2)" stroke-width="7" stroke-linecap="round" fill="none"/>
          <circle cx="41.9" cy="41.9" r="4.8" fill="#00A86B"/>
          <circle cx="40.4" cy="40.4" r="1.8" fill="#00D48A" opacity="0.6"/>
        </svg>
        <span class="wordmark">Connex</span>
      </div>
    </div>
  </div>

  <p class="tip">
    <strong>To save as PNG:</strong><br/>
    Mac — press <code>Cmd + Shift + 4</code> and drag to select the white card above.<br/>
    Windows — press <code>Win + Shift + S</code> and drag to select it.<br/>
    Upload that screenshot to the form.
  </p>

</body>
</html>
